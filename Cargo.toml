[workspace]
resolver = "2"
members = ["crates/open-envault"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sayanmohsin/open-envault"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
sha2 = "0.11"

aes-gcm = { version = "0.11", features = ["aes", "alloc"] }
age = { version = "0.12", features = ["armor"] }
base64 = "0.23"
hex = "0.4"
rand = "0.10"
zeroize = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
